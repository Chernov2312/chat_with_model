name: linter_test
on:
    push:
        branches:
            - main
            - master
jobs:
  linter-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt
      - name: Isort check
        run: isort . --check-only
      - name: black
        run: black --check .
      - name: flake8
        run: flake8 .
